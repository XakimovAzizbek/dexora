<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dexora</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <header>
    <div class="logo">Dexora</div>
    <div class="status-wrapper">
      <span class="status-dot"></span>
      <span class="status-text">Onlayn</span>
    </div>
  </header>

  <main id="chat" aria-live="polite">
    <div class="msg bot">
      Salom! Men Dexoraman. Menga savol bering.
    </div>
  </main>

  <form id="form" autocomplete="off">
    <div class="input-wrapper">
      <input id="input" placeholder="Xabar yozing..." required>
      <button id="send" type="submit" aria-label="Yuborish">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </form>

  <script src="index.js"></script>
</body>
</html>
