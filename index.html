<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dexora</title>
<link rel="stylesheet" href="index.css">
</head>
<body>
<header>
  <h1>Dexora</h1>
  <p>Brauzeringizda ishlaydigan AI. Kalit yo'q, server yo'q.</p>
</header>

<section id="loader">
  <label for="model">Model</label>
  <select id="model">
    <option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">Qwen2.5 0.5B (yengil, ~400 MB)</option>
    <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen2.5 1.5B (aqlliroq, ~1 GB)</option>
  </select>
  <button id="load">Modelni yuklash</button>
  <div id="bar" hidden><div id="fill"></div></div>
  <p id="status">WebGPU tekshirilmoqda...</p>
</section>

<main id="chat" aria-live="polite"></main>

<div id="tests" hidden>
  <button data-q="Salom! O'zingni tanishtir.">Salom</button>
  <button data-q="O'zbekiston poytaxti qaysi shahar va u haqida 2 ta gap ayt.">Poytaxt</button>
  <button data-q="Translate to English: Men bugun bozorga bordim.">Tarjima</button>
</div>

<form id="form" autocomplete="off">
  <input id="input" placeholder="Xabar yozing..." disabled>
  <button id="send" disabled>Yuborish</button>
</form>

<script type="module" src="index.js"></script>
</body>
</html>
